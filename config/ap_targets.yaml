# ap_targets.yaml — контролируемые точки доступа оператора
# Права 600; в экспорт НЕ включается; НЕ коммитить реальные пароли.
#
# Из «учётных» данных нужны только имя сети (ssid) и пароль (psk|psk_hash).
# BSSID не требуется — подключение идёт по имени SSID.
# security НЕ обязателен: тип шифрования определяется из эфира при наблюдении точки
# (скан в режиме 2 / данные монитора в режиме 3). Задайте его вручную только чтобы
# переопределить автоопределение.

# Общие параметры проверки (можно переопределить у точки)
defaults:
  check_url: "http://connectivitycheck.gstatic.com/generate_204"
  check_timeout_s: 10
  dhcp_timeout_s: 30

access_points:
  - id: "my_point"          # человекочитаемый идентификатор
    ssid: "123"             # имя сети (обязательно)
    psk: "11112222"             # пароль в открытом виде ЛИБО psk_hash ниже
    # security: "wpa2-psk"      # опц.: open | wpa-psk | wpa2-psk | wpa3-sae | wpa2-eap
    # hidden: false             # опц.: скрытая сеть (SSID не вещается)
    enabled: true
