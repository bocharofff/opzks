# Основные настройки wifi-monitor
db_path: data/wifi_monitor.db
kismet_db_path: data/kismet.kismet
targets_path: config/ap_targets.yaml

# GPS-демон
gps_host: 127.0.0.1
gps_port: 2947

# Синхронизация данных из Kismet
sync_interval_sec: 30

# Тепловая карта сигнала
# Даунсэмплинг: 1 сэмпл (координата→сигнал) на N секунд на сеть.
# GPS обновляется ~1/сек, поэтому 1 — без потери качества карты и с минимальной базой.
heatmap_sample_sec: 1

# Проверка точек оператора «по факту присутствия»
presence_window_sec: 45    # режим 3: окно «видно сейчас» по данным монитора
recheck_interval_sec: 60   # кулдаун перепроверки одной точки (стоим рядом → не долбим)
scan_interval_sec: 8       # пауза между сканами/циклами присутствия
min_signal_dbm: null       # опц. порог dBm: слабее — не проверять (null = без порога)
default_security: wpa2-psk # запасной тип шифрования, если не задан и не выведен из эфира

# Логирование
log_level: INFO
log_file: data/wifi_monitor.log
