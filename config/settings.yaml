# Основные настройки wifi-monitor
db_path: data/wifi_monitor.db
kismet_db_path: data/kismet.kismet
targets_path: config/ap_targets.yaml

# GPS-демон
gps_host: 127.0.0.1
gps_port: 2947

# Синхронизация данных из Kismet
sync_interval_sec: 30

# Тепловая карта сигнала
# Даунсэмплинг: 1 сэмпл (координата→сигнал) на N секунд на сеть.
# GPS обновляется ~1/сек, поэтому 1 — без потери качества карты и с минимальной базой.
heatmap_sample_sec: 1

# Проверка точек оператора «по факту присутствия»
presence_window_sec: 45    # режим 3: окно «видно сейчас» по данным монитора
recheck_interval_sec: 60   # кулдаун перепроверки одной точки (стоим рядом → не долбим)
scan_interval_sec: 8       # пауза между сканами/циклами присутствия
min_signal_dbm: null       # опц. порог dBm: слабее — не проверять (null = без порога)
default_security: wpa2-psk # запасной тип шифрования, если не задан и не выведен из эфира

# Профиль экспорта "map" — интерактивная тепловая карта в HTML (открывается в браузере,
# QGIS не нужен). Здесь весь тюнинг карты: в CLI отдельных флагов нет, а отбор сети и
# период задаются общими --export-ssid/--export-bssid/--export-since/--export-until.
# Достаточно указать только те параметры, которые нужно изменить — остальные берутся
# из встроенных дефолтов (секция сливается по ключам).
map:
  # Отбор сетей
  top: 10                  # сколько сетей показать слоями (по убыванию числа замеров)
  min_points: 20           # минимум замеров у сети, иначе слой не строится

  # Интерполяция (IDW)
  grid_step_m: 3.0         # шаг сетки, метры (мельче — детальнее и тяжелее)
  idw_power: 2.0           # степень IDW
  idw_neighbors: 12        # число ближайших замеров в расчёте ячейки
  idw_radius_m: null       # радиус поиска соседей, метры (null = без ограничения)
  max_distance_m: 10.0     # полуширина зоны «есть данные» вокруг трека, метры
  mask_mode: track         # track — коридор вдоль маршрута; points — буфер вокруг точек
  bridge_max_m: 40.0       # макс. длина пути между детекциями, ещё соединяемого коридором
  bridge_max_s: 30.0       # макс. пауза между детекциями для соединения (разные заезды не склеиваются)
  cluster_eps_m: 100.0     # порог кластеризации замеров одной сети, метры
  min_cluster_points: 3    # минимум точек в кластере, иначе он отбрасывается как шум
  max_cells: 4000000       # предел ячеек сетки на слой (при превышении шаг огрубляется)

  # Отрисовка
  rssi_min: -90.0          # нижняя граница цветовой шкалы, дБм
  rssi_max: -30.0          # верхняя граница цветовой шкалы, дБм
  rssi_auto: false         # true — шкала каждого слоя подгоняется под факт. min/max сети
  opacity: 0.6             # прозрачность тепловых слоёв, 0..1
  cmap: RdYlGn             # цветовая карта matplotlib
  reverse_cmap: true       # true — красный сильный сигнал / зелёный слабый
  show_points: false       # true — добавить слой фактических точек замеров

# Логирование
# log_level — уровень КОНСОЛИ в обычном режиме (майлстоуны, итоги проверки точек,
# warnings/errors). Файл (log_file) пишет полный DEBUG всегда, независимо от режима.
# debug: true (или флаг --debug) поднимает уровень консоли до DEBUG.
log_level: INFO
log_file: data/wifi_monitor.log
debug: false
