[pytest]
# Тесты проекта живут только в tests/. Явное указание нужно, чтобы голый `pytest`
# из корня не подхватывал посторонние наборы (например, исходную папку map/ с
# копией модуля карты — её тесты перенесены в tests/test_map_*.py и импортируют
# уже src.wifi_heatmap).
testpaths = tests
norecursedirs = .git .venv venv ENV map export data
